# master 를 release 가지로 합치면 배포 판을 낸다(태그 v<버전>). Split · Monitor 와 같은 방식이다.
# 1) 버전을 출시일 기준으로 올려 release 에 커밋한다([skip ci]),
# 2) electron-builder 로 macOS 판(Apple silicon, Intel)을 만들어 Developer ID 로 서명 · 공증하고,
# 3) GitHub Releases(태그 v<버전>)에 올린다. electron-updater 가 읽는 latest-mac.yml 도 같이 올린다.
#
# 서명 키는 조직 비밀값에서 이 실행 동안만 쓰는 임시 키체인에 넣고 끝나면 지운다.
# 저장소가 조직 비밀값을 쓸 수 있게 조직 설정에서 허락되어 있어야 한다.
#
# 손으로 돌릴 때(workflow_dispatch) publish 를 끄면 버전을 올리지 않고 빌드 · 서명 · 공증까지만 해서
# 결과를 실행 기록 첨부로만 남긴다. 아무에게도 배포되지 않으니 빌드 시험에 쓴다.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      publish:
        description: "버전을 올리고 배포하기 (끄면 시험 실행)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: draw-release
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  version:
    # 버전 올림 커밋이 다시 이 워크플로를 부르지 않게 막는다
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version || steps.current.outputs.version }}
      sha: ${{ steps.bump.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISH == 'true' && 'release' || github.ref }}
          fetch-depth: 0  # 태그로 같은 날 낸 버전이 있는지 본다

      - name: 버전을 올려 푸시
        id: bump
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          BUMPED=$(scripts/bump-release.sh)
          VERSION=$(echo "$BUMPED" | sed -n 1p)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          # 멈춘 배포를 다시 돌리면 버전이 이미 올라가 있다. 바뀐 게 없으면 커밋을 건너뛴다.
          git diff --cached --quiet || git commit -q -m "Draw $VERSION [skip ci]"
          git push origin HEAD:release
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 시험 실행의 버전 고르기
        id: current
        if: env.PUBLISH != 'true'
        run: echo "version=$(jq -r .version package.json)-test" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # Split 과 같은 까닭으로 macos-15 를 쓴다(macos-26 은 대기열에서 취소된 적이 있다)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DRAW_TAG: ${{ needs.version.outputs.version }}
      # 시험판 전용 코드(src/main/testShots.js)를 빼고, hardened runtime · 서명 · 공증을 켠다
      DRAW_RELEASE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: 임시 서명 키체인 준비
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail
          SECRETS="$RUNNER_TEMP/draw-secrets"
          mkdir -p "$SECRETS" && chmod 700 "$SECRETS"
          KEYCHAIN="$RUNNER_TEMP/draw-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          # 끝날 때 키체인 검색 목록을 원래대로 돌린다
          security list-keychains -d user | tr -d '" ' > "$SECRETS/keychains-before"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$SECRETS/developer-id.p12"
          security import "$SECRETS/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(cat "$SECRETS/keychains-before")
          rm "$SECRETS/developer-id.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          printf '%s' "$ASC_API_KEY_P8" > "$SECRETS/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$SECRETS/"*
          echo "APPLE_API_KEY_PATH=$SECRETS/AuthKey_${ASC_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      # 위 키체인의 Developer ID 로 서명하고(CSC_NAME), APPLE_API_* 로 앱을 공증한다.
      # 올리기는 publish 작업이 하므로 여기서는 --publish never.
      - name: 앱 묶기
        env:
          CSC_NAME: Runners Co., Ltd (RGWVXJ8URP)
          APPLE_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY="$APPLE_API_KEY_PATH"
          npx electron-builder --config builder.config.cjs --mac --publish never

      # 앱은 electron-builder 가 공증했지만 DMG 자체도 공증 · 스테이플해야 오프라인에서도 경고 없이 열린다
      - name: DMG 공증
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for DMG in dist.noindex/*.dmg; do
            xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" --wait
            xcrun stapler staple "$DMG"
          done

      - name: 파일 모으기
        run: |
          set -euo pipefail
          OUT=dist-release && mkdir -p $OUT
          shopt -s nullglob
          for f in dist.noindex/*.{dmg,zip,blockmap,yml}; do
            case "$(basename "$f")" in builder-debug.yml|builder-effective-config.yaml) continue ;; esac
            cp "$f" "$OUT/"
          done
          ls -la $OUT

      - uses: actions/upload-artifact@v4
        with:
          name: draw-macos
          path: dist-release/*
          retention-days: 3

      - name: 임시 키체인과 키 지우기
        if: always()
        run: |
          SECRETS="$RUNNER_TEMP/draw-secrets"
          if [ -f "$SECRETS/keychains-before" ]; then
            security list-keychains -d user -s $(cat "$SECRETS/keychains-before")
          fi
          security delete-keychain "$RUNNER_TEMP/draw-signing.keychain-db" 2>/dev/null || true
          rm -rf "$SECRETS"

  publish:
    needs: [version, build]
    if: needs.version.result == 'success' && github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      # 릴리스 본문은 저장소의 RELEASE_NOTES.md("## 한국어" · "## English" 두 칸의 "- " 목록)다. 앱의 업데이트 창이
      # 이 본문에서 자기 언어 칸의 목록만 읽어 "바뀐 점"으로 보여 준다. 버전 올리기(scripts/bump-release.sh)가
      # 비었거나 지난 판 그대로인 파일을 막는다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: repo
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - name: GitHub 릴리스 내기
        run: |
          set -euo pipefail
          # 홈페이지의 받기 단추는 releases/latest/download/<이름> 을 쓰므로 버전 없는 이름도 올린다.
          # 버전 붙은 파일은 Homebrew cask 와 자동 업데이트가 받는다.
          cp "files/Draw-$VERSION-mac-arm64.dmg" files/draw-macos-arm64.dmg
          cp "files/Draw-$VERSION-mac-x64.dmg" files/draw-macos-x64.dmg
          ls -la files
          gh release create "v$VERSION" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.version.outputs.sha }}" \
            --title "Draw $VERSION" \
            --notes-file repo/RELEASE_NOTES.md
