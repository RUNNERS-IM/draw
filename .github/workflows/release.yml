# master 를 release 가지로 합치면 배포 판을 낸다(태그 v<버전>). Split · Monitor 와 같은 방식이다.
# 1) 버전을 출시일 기준으로 올려 release 에 커밋한다([skip ci]),
# 2) electron-builder 로 macOS(Apple silicon, Intel) · Windows(x64) · Linux(x64) 판을 만든다. macOS 판만
#    Developer ID 로 서명 · 공증한다. Windows · Linux 판은 다른 네 앱처럼 서명하지 않는다.
# 3) GitHub Releases(태그 v<버전>)에 올린다. electron-updater 가 읽는 latest-mac.yml · latest.yml ·
#    latest-linux.yml 도 같이 올린다.
#
# 빌드 단계는 build.yml 에 있다. Mac 판은 GitHub Mac(macos-15)에서 먼저 만들고, 그 작업이 취소 · 실패하면
# 사무실 맥 스튜디오(m2-ultra-sun-1)가 같은 출시 안에서 이어서 만든다. publish 는 성공한 쪽 Mac 판을 올린다.
#
# 서명 키는 조직 비밀값에서 이 실행 동안만 쓰는 임시 키체인에 넣고 끝나면 지운다.
# 저장소가 조직 비밀값을 쓸 수 있게 조직 설정에서 허락되어 있어야 한다.
#
# 손으로 돌릴 때(workflow_dispatch) publish 를 끄면 버전을 올리지 않고 빌드 · 서명 · 공증까지만 해서
# 결과를 실행 기록 첨부로만 남긴다. 아무에게도 배포되지 않으니 빌드 시험에 쓴다.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      publish:
        description: "버전을 올리고 배포하기 (끄면 시험 실행)"
        type: boolean
        default: false
      skip_github_mac:
        description: "GitHub Mac 작업을 건너뛰어 맥 스튜디오 대체 경로를 시험하기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: draw-release
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  version:
    # 버전 올림 커밋이 다시 이 워크플로를 부르지 않게 막는다
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version || steps.current.outputs.version }}
      sha: ${{ steps.bump.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PUBLISH == 'true' && 'release' || github.ref }}
          fetch-depth: 0  # 태그로 같은 날 낸 버전이 있는지 본다

      - name: 버전을 올려 푸시
        id: bump
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          BUMPED=$(scripts/bump-release.sh)
          VERSION=$(echo "$BUMPED" | sed -n 1p)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          # 멈춘 배포를 다시 돌리면 버전이 이미 올라가 있다. 바뀐 게 없으면 커밋을 건너뛴다.
          git diff --cached --quiet || git commit -q -m "Draw $VERSION [skip ci]"
          git push origin HEAD:release
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 시험 실행의 버전 고르기
        id: current
        if: env.PUBLISH != 'true'
        run: echo "version=$(jq -r .version package.json)-test" >> "$GITHUB_OUTPUT"

  # Windows · Linux 판. Mac 판은 아래 두 작업이 맡는다.
  build:
    needs: version
    # 세 운영체제 모두 내놓는다(2026-11-11 사용자: 「모든 프로그램은 Mac linux window 셋다」).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: '"windows-latest"'
            builder: --win
          - os: linux
            runner: '"ubuntu-22.04"'  # 오래된 glibc 로 빌드해야 더 많은 배포판에서 켜진다
            builder: --linux
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      runner: ${{ matrix.runner }}
      builder: ${{ matrix.builder }}
      version: ${{ needs.version.outputs.version }}
      sha: ${{ needs.version.outputs.sha }}

  # Mac 판은 먼저 GitHub 의 Apple 칩 Mac(macos-15)에서 만든다. Split 과 같은 까닭으로 macos-26 대신 macos-15 를 쓴다.
  build-mac:
    needs: version
    if: ${{ !inputs.skip_github_mac }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      os: macos
      runner: '"macos-15"'
      builder: --mac
      version: ${{ needs.version.outputs.version }}
      sha: ${{ needs.version.outputs.sha }}

  # GitHub Mac 작업이 취소 · 실패하면(시험에서 건너뛰어도) 같은 출시 안에서 사무실 맥 스튜디오가 이어서 만든다
  # (2026-11-12 결정 「Mac 판은 GitHub 기계 먼저, 못 받으면 맥 스튜디오에서」). 서명 키체인은 끝나면 지우고,
  # 남아 있으면 이 작업을 실패로 끝낸다(build.yml 맨 끝 단계).
  build-mac-studio:
    needs: [version, build-mac]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.build-mac.result != 'success' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      os: macos
      runner: '["self-hosted", "macOS", "ARM64", "m2-ultra-sun-1"]'
      builder: --mac
      version: ${{ needs.version.outputs.version }}
      sha: ${{ needs.version.outputs.sha }}

  publish:
    needs: [version, build, build-mac, build-mac-studio]
    # 둘 중 성공한 Mac 판으로 올린다. 맥 스튜디오 작업은 GitHub Mac 이 성공하면 건너뛰어진다.
    if: >-
      !cancelled() && needs.version.result == 'success' && needs.build.result == 'success' &&
      (needs.build-mac.result == 'success' || needs.build-mac-studio.result == 'success') &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true

      # 릴리스 본문은 저장소의 RELEASE_NOTES.md("## 한국어" · "## English" 두 칸의 "- " 목록)다. 앱의 업데이트 창이
      # 이 본문에서 자기 언어 칸의 목록만 읽어 "바뀐 점"으로 보여 준다. 버전 올리기(scripts/bump-release.sh)가
      # 비었거나 지난 판 그대로인 파일을 막는다.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: repo
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - name: GitHub 릴리스 내기
        run: |
          set -euo pipefail
          # 홈페이지의 받기 단추는 releases/latest/download/<이름> 을 쓰므로 버전 없는 이름도 올린다.
          # 버전 붙은 파일은 Homebrew cask 와 자동 업데이트가 받는다.
          cp "files/Draw-$VERSION-mac-arm64.dmg" files/draw-macos-arm64.dmg
          cp "files/Draw-$VERSION-mac-x64.dmg" files/draw-macos-x64.dmg
          cp "files/draw-$VERSION-windows-x64-setup.exe" files/draw-windows-x64-setup.exe
          cp "files/draw-$VERSION-linux-x86_64.AppImage" files/draw-linux-x86_64.AppImage
          cp "files/draw-$VERSION-linux-amd64.deb" files/draw-linux-amd64.deb
          ls -la files
          gh release create "v$VERSION" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.version.outputs.sha }}" \
            --title "Draw $VERSION" \
            --notes-file repo/RELEASE_NOTES.md
