<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Extended Toolbar</title>
    <style>
      :root {
        --toolbar-window-margin: 10px; /* Matches with EXTENDED_TOOLBAR_WINDOW_MARGIN */

        --toolbar-background-color: #F6F6F6;
        --toolbar-border-color: rgba(0, 0, 0, 0.14);
        --toolbar-icon-color: rgba(0, 0, 0, 0.85);
        --toolbar-hover-color: rgba(0, 0, 0, 0.06);
        --toolbar-thickness: 44px;
        --toolbar-arrow-size: 17px; /* Matches pointerToolbarArrowSize */
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --toolbar-background-color: #2A2A2A;
          --toolbar-border-color: rgba(255, 255, 255, 0.16);
          --toolbar-icon-color: rgba(255, 255, 255, 0.88);
          --toolbar-hover-color: rgba(255, 255, 255, 0.1);
        }
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      button {
        background: none;
        border: none;
        padding: 0;
      }

      button:focus {
        outline: none;
      }

      button svg {
        pointer-events: none;
      }

      .toolbar__mode-switcher {
        -webkit-app-region: drag;
      }

      .toolbar__close,
      .toolbar__main-button {
        -webkit-app-region: no-drag;  /* overlaps switcher */
      }

      .toolbar-extended {
        position: absolute;
        top: var(--toolbar-window-margin);
        left: var(--toolbar-window-margin);
      }

      #toolbar {
        width: 44px;
        height: 56px;
        color: var(--toolbar-icon-color);
      }

      .toolbar__close {
        position: absolute;
        top: -5px;
        left: -5px;
        z-index: 1;
        background-color: var(--toolbar-background-color);
        border: 0.5px solid var(--toolbar-border-color);
        border-radius: 15px;
        color: var(--toolbar-icon-color);
        opacity: 0;
      }

      #toolbar:hover .toolbar__close {
        opacity: 1;
      }

      .toolbar__close button {
        color: inherit;
        display: flex;
        padding: 2px;
        justify-content: center;
        align-items: center;
      }

      .toolbar__close svg {
        width: 12px;
        height: 12px;
      }

      .toolbar__mode-switcher {
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
        width: 44px;
        height: 56px;
        background-color: var(--toolbar-background-color);
        border-radius: 14px 14px 0 0;
        box-shadow: 0 0 0 0.5px var(--toolbar-border-color);
      }

      .toolbar__main-button {
        display: flex;
      }

      .toolbar__main-button button {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 34px;
        height: 34px;
        color: inherit;
        border-radius: 8px;
        cursor: pointer;
      }

      .toolbar__main-button button:hover {
        background-color: var(--toolbar-hover-color);
      }

      .toolbar__main-button svg {
        width: 20px;
        height: 20px;
      }

      .toolbar__draglines:last-child {
        display: none;
      }

      .toolbar__draglines {
        display: flex;
        padding: 7px 0 3px;
        align-items: center;
      }

      .draglines {
        display: grid;
        row-gap: 2px;
        column-gap: 2px;
        grid-template-columns: repeat(3, min-content);
      }

      .draglines div {
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background-color: var(--toolbar-border-color);
      }

      .toolbar__slider {
        position: absolute;
        display: flex;
        align-self: center;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        border: 0.5px solid var(--toolbar-border-color);
        background-color: var(--toolbar-background-color);
        cursor: pointer;
      }

      .toolbar__slider svg {
        width: 16px;
        height: 16px;
      }

      .toolbar--horizontal {
        margin-left: var(--toolbar-arrow-size);
      }

      .toolbar--horizontal .toolbar__slider {
        left: 100%;
        top: 50%;
        transform: translateY(-50%);
        width: var(--toolbar-arrow-size);
        height: var(--toolbar-thickness);
        border-left: 0;
        border-radius: 0 10px 10px 0;
      }

      .toolbar--horizontal.toolbar--reversed .toolbar__slider {
        left: auto;
        right: 100%;
        border-left: 1px solid var(--toolbar-border-color);
        border-right: 0;
        border-radius: 10px 0 0 10px;
      }

      .toolbar--horizontal.toolbar--reversed .toolbar__slider svg {
        rotate: 180deg;
      }

      .toolbar--vertical.toolbar--reversed .toolbar__mode-switcher {
        border-radius: 0 0 14px 14px;
      }

      .toolbar--vertical {
        margin-top: var(--toolbar-arrow-size);
      }

      .toolbar--vertical .toolbar__slider {
        left: 50%;
        top: 100%;
        transform: translateX(-50%);
        width: var(--toolbar-thickness);
        height: var(--toolbar-arrow-size);
        border: 0;
        box-shadow: 0 0 0 0.5px var(--toolbar-border-color);
        color: var(--toolbar-icon-color);
        border-radius: 0 0 14px 14px;
      }

      .toolbar--vertical .toolbar__slider svg {
        rotate: 90deg;
      }

      .toolbar--vertical.toolbar--reversed .toolbar__slider {
        top: auto;
        bottom: 100%;
        border-radius: 14px 14px 0 0;
      }

      .toolbar--vertical.toolbar--reversed .toolbar__slider svg {
        rotate: -90deg;
      }
    </style>
  </head>

  <body>
    <aside id="toolbar" class="toolbar-extended">
      <div class="toolbar__mode-switcher">
        <div class="toolbar__draglines">
          <div class="draglines">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
          </div>
        </div>

        <div class="toolbar__main-button">
          <button tabindex="-1" >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"></path>
            </svg>
          </button>
        </div>

        <div class="toolbar__draglines">
          <div class="draglines">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
          </div>
        </div>
      </div>

      <div class="toolbar__slider">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </div>

      <div class="toolbar__close">
        <button tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path>
          </svg>
        </button>
      </div>
    </aside>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
